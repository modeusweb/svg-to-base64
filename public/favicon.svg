<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a06bff"/>
      <stop offset=".55" stop-color="#863bff"/>
      <stop offset="1" stop-color="#5c17c9"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".28"/>
      <stop offset=".28" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- tile -->
  <rect width="512" height="512" rx="112" fill="url(#tile)"/>
  <rect width="512" height="512" rx="112" fill="url(#sheen)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" stroke="#ffffff" stroke-opacity=".22" stroke-width="8" fill="none"/>

  <!-- code brackets < > -->
  <g stroke="#ffffff" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M186 156 L102 256 L186 356"/>
    <path d="M326 156 L410 256 L326 356"/>
  </g>

  <!-- bezier curve with anchor point -->
  <path d="M216 316 C 248 200, 264 200, 296 316" stroke="#ffffff" stroke-width="26" stroke-linecap="round" fill="none"/>
  <circle cx="256" cy="218" r="34" fill="#ffffff"/>
  <circle cx="256" cy="218" r="13" fill="#863bff"/>
</svg>
